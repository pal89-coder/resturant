<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مطعم يرموك</title>
    <meta name="description" content="تسجيل الدخول إلى حسابك في مطعم يرموك.">
    <meta property="og:title" content="تسجيل الدخول - مطعم يرموك">
    <meta property="og:description" content="تسجيل الدخول إلى حسابك في مطعم يرموك.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="styles-arabic.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="restaurant-logo.webp" alt="شعار مطعم يرموك" class="logo-icon">
                <span class="logo-text">يرموك</span>
            </div>
            <nav class="nav">
                <a href="index-arabic.html" class="nav-link">الرئيسية</a>
                <a href="index.html" class="lang-badge-nav">English</a>
            </nav>
        </div>
    </header>

    <!-- Login Section -->
    <section class="login-section">
        <div class="container">
            <div class="login-container">
                <div class="login-header">
                    <div class="login-logo">
                        <img src="restaurant-logo.webp" alt="شعار مطعم يرموك">
                    </div>
                    <h1 class="login-title">مرحباً بعودتك</h1>
                    <p class="login-subtitle">سجل الدخول إلى حسابك في يرموك</p>
                </div>
                
                <form class="login-form">
                    <div class="form-group">
                        <label for="username">اسم المستخدم</label>
                        <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" placeholder="أدخل البريد الإلكتروني" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>تذكرني</span>
                        </label>
                        <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">تسجيل الدخول</button>
                    
                    <div class="login-divider">
                        <span>أو تابع مع</span>
                    </div>
                    
                    <div class="social-login">
                        <button type="button" class="btn btn-social btn-google">
                            <span>جوجل</span>
                        </button>
                        <button type="button" class="btn btn-social btn-facebook">
                            <span>فيسبوك</span>
                        </button>
                    </div>
                    
                    <div class="signup-link">
                        <p>ليس لديك حساب؟ <a href="signup-arabic.html">إنشاء حساب</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="restaurant-logo.webp" alt="شعار مطعم يرموك" class="logo-icon">
                    <span>يرموك</span>
                </div>
                <div class="footer-links">
                    <a href="index-arabic.html">الرئيسية</a>
                    <a href="index-arabic.html#about">عن المطعم</a>
                    <a href="index-arabic.html#contact">اتصل بنا</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 مطعم يرموك. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <script src="database.js"></script>
    <script src="script.js"></script>
    <script src="login.js"></script>
</body>
</html>
