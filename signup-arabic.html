<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - مطعم يرموك</title>
    <meta name="description" content="أنشئ حساباً في مطعم يرموك لتسهيل الحجوزات وتجربة طعام مميزة.">
    <meta property="og:title" content="إنشاء حساب - مطعم يرموك">
    <meta property="og:description" content="أنشئ حساباً في مطعم يرموك لتسهيل الحجوزات وتجربة طعام مميزة.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="styles-arabic.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="restaurant-logo.webp" alt="شعار مطعم يرموك" class="logo-icon">
                <span class="logo-text">يرموك</span>
            </div>
            <nav class="nav">
                <a href="index-arabic.html" class="nav-link">الرئيسية</a>
                <a href="login-arabic.html" class="nav-link">تسجيل الدخول</a>
                <a href="signup.html" class="lang-badge-nav">English</a>
            </nav>
        </div>
    </header>

    <!-- Signup Section -->
    <section class="login-section">
        <div class="container">
            <div class="login-container">
                <div class="login-header">
                    <div class="login-logo">
                        <img src="restaurant-logo.webp" alt="شعار مطعم يرموك">
                    </div>
                    <h1 class="login-title">إنشاء حساب جديد</h1>
                    <p class="login-subtitle">انضم إلى مجتمع يرموك لتجربة طعام استثنائية</p>
                </div>
                
                <form class="signup-form">
                    <div class="form-group">
                        <label for="reg-username">اسم المستخدم</label>
                        <input type="text" id="reg-username" name="username" placeholder="اختر اسم المستخدم" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-email">البريد الإلكتروني</label>
                        <input type="email" id="reg-email" name="email" placeholder="أدخل البريد الإلكتروني" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password">كلمة المرور</label>
                        <input type="password" id="reg-password" name="password" placeholder="6 أحرف على الأقل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-confirm">تأكيد كلمة المرور</label>
                        <input type="password" id="reg-confirm" name="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">إنشاء الحساب</button>
                    
                    <div class="signup-link" style="margin-top: 1.5rem;">
                        <p>لديك حساب بالفعل؟ <a href="login-arabic.html">تسجيل الدخول</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="restaurant-logo.webp" alt="شعار مطعم يرموك" class="logo-icon">
                    <span>يرموك</span>
                </div>
                <div class="footer-links">
                    <a href="index-arabic.html">الرئيسية</a>
                    <a href="index-arabic.html#about">عن المطعم</a>
                    <a href="index-arabic.html#contact">اتصل بنا</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 مطعم يرموك. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <script src="database.js"></script>
    <script>
        const form = document.querySelector('.signup-form');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('reg-username').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;
                const confirm = document.getElementById('reg-confirm').value;

                if (password !== confirm) {
                    alert('كلمات المرور غير متطابقة.');
                    return;
                }
                if (password.length < 6) {
                    alert('يجب أن تكون كلمة المرور 6 أحرف على الأقل.');
                    return;
                }

                const btn = form.querySelector('button[type="submit"]');
                const origText = btn.textContent;
                btn.textContent = 'جاري إنشاء الحساب...';
                btn.disabled = true;

                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        alert('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
                        window.location.href = 'login-arabic.html';
                        return;
                    } else if (data.error) {
                        alert(data.error);
                        return;
                    }
                } catch (err) {
                    console.warn('Fallback to client db:', err);
                } finally {
                    btn.textContent = origText;
                    btn.disabled = false;
                }

                if (!dbManager && typeof initializeDatabase === 'function') {
                    await initializeDatabase();
                }
                if (dbManager) {
                    const result = dbManager.registerUser(username, email, password);
                    if (result.success) {
                        alert('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
                        window.location.href = 'login-arabic.html';
                    } else {
                        alert(result.message);
                    }
                }
            });
        }
    </script>
</body>
</html>
